<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
       function add(){
        var a= Number(document.getElementById('t1').value)
        var b= Number(document.getElementById('t2').value)
        var c=a+b
        document.getElementById('t3').value="addition="+c
       }
       function sub()
       {
        var a= Number(document.getElementById('t1').value)
        var b=Number(document.getElementById('t2').value)
        var c=a-b
        document.getElementById('t3').value="substraction="+c
       }
       function multi()
       {
        var a= Number(document.getElementById('t1').value)
        var b=Number(document.getElementById('t2').value)
        var c=a*b
        document.getElementById('t3').value="multification="+c
       }
       function divi()
       {
        var a= Number(document.getElementById('t1').value)
        var b=Number(document.getElementById('t2').value)
        var c=a/b
        document.getElementById('t3').value="divition="+c
       }
       function clr()
       {
         document.getElementById('t1').value=""
       document.getElementById('t2').value=""
        document.getElementById('t3').value=""
       }
    </script>
</head>
<body>
   enter the first no=<input type="text" id="t1"><br><br>
   enter the second no=<input type="text" id="t2"><br><br>
   result=<input type="text" id="t3" readonly><br><br>
   <input type="button" value="+"onclick="add()">
   <input type="button" value="-"onclick="sub()">
   <input type="button" value="*"onclick="multi()">
   <input type="button" value="/"onclick="divi()">
   <input type="button" value="c"onclick="clr()">
   <h1>heloo viue </h1>
</body>
</html>
